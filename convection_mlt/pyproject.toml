[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convection-mlt"
version = "0.2.0"
description = "Reference mixing-length convection kernel with Stage 2 variable thermodynamics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
plot = ["matplotlib>=3.8"]
jax = ["jax[cpu]>=0.4", "jaxlib>=0.4"]
helios = ["pycuda>=2025.1", "scipy", "astropy", "h5py", "numba", "wget"]

[project.scripts]
mlt-baseline = "convection_mlt.cli:baseline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"convection_mlt.thermo_data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["stage0/tests", "stage1/tests", "stage2/tests", "stage3/tests", "stage4/tests"]
pythonpath = ["src"]
addopts = "-ra"
